<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krushi Sakha — Field Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#E4EFD6; --paper:#FBFCF6; --ink:#233821;
  --green:#3B6B3E; --green-deep:#1E3D24; --moss:#6E9A54;
  --clay:#8B5E3C; --clay-deep:#5E3E27;
  --amber:#B9812E; --rust:#B5533C;
  --line: rgba(30,61,36,.16);
  --shadow: 0 10px 30px rgba(20,40,20,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#132014; --paper:#1B2B1C; --ink:#E3EEDA; --line: rgba(227,238,218,.16); --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{ --cream:#132014; --paper:#1B2B1C; --ink:#E3EEDA; --line: rgba(227,238,218,.16); --shadow:0 10px 30px rgba(0,0,0,.5); }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:'Inter','Noto Sans Devanagari',sans-serif;line-height:1.5;
  background:
    radial-gradient(700px 420px at 90% -8%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(59,107,62,.18), transparent 55%),
    var(--cream);
}
h1,h2,h3{font-family:'Fraunces','Noto Sans Devanagari',serif;font-weight:600;margin:0;color:var(--green-deep)}
:root[data-theme="dark"] h1, :root[data-theme="dark"] h2, :root[data-theme="dark"] h3{color:#CFE3C9}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}
header.top{display:flex;align-items:center;gap:12px;padding:18px 22px;position:sticky;top:0;background:rgba(251,252,246,.82);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
:root[data-theme="dark"] header.top{background:rgba(27,43,28,.82)}
.crops{display:flex;flex-wrap:wrap;gap:8px}
.cropchip{border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--ink)}
.cropchip .emoji{font-size:22px;display:block;margin-bottom:4px}
.cropchip:hover{border-color:var(--moss)}
.cropchip.active{border-color:var(--green);outline:2px solid var(--green);background:rgba(59,107,62,.1)}
.logo{width:38px;height:38px;flex:none}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:var(--green-deep)}
:root[data-theme="dark"] .brand{color:#CFE3C9}
.langsel{margin-left:auto}
.langsel select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:inherit;font-size:13px}

.hero{padding:54px 0 30px}
.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.2;max-width:18ch}
.hero p.lead{margin-top:14px;max-width:58ch;font-size:17px;color:var(--ink);opacity:.85}
.hero .note{margin-top:18px;font-size:14px;color:var(--clay-deep);background:rgba(139,94,60,.1);border:1px solid rgba(139,94,60,.25);padding:10px 14px;border-radius:10px;display:inline-block}
:root[data-theme="dark"] .hero .note{color:#D9B98E;background:rgba(139,94,60,.18)}

section{padding:26px 0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:18px}
.panel h2{font-size:22px;margin-bottom:6px}
.sub{font-size:14px;color:var(--ink);opacity:.7;margin-bottom:16px}

.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.sample{border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:10px 6px 8px;text-align:center;cursor:pointer;font-family:inherit;font-size:12px;color:var(--ink)}
.sample:hover{border-color:var(--moss)}
.sample.active{border-color:var(--green);outline:2px solid var(--green);background:rgba(59,107,62,.08)}
.leaf-icon{width:40px;height:40px;margin:0 auto 6px;border-radius:50%;position:relative;overflow:hidden}
.leaf-icon svg{width:100%;height:100%}
.spotoverlay{position:absolute;inset:0;background-image:radial-gradient(circle at 30% 35%,rgba(60,40,20,.55) 0 4px, transparent 5px),radial-gradient(circle at 65% 55%,rgba(60,40,20,.5) 0 3px, transparent 4px),radial-gradient(circle at 45% 75%,rgba(60,40,20,.5) 0 3px, transparent 4px)}
.holeoverlay{position:absolute;inset:0;background-image:radial-gradient(circle at 35% 40%,var(--cream) 0 3px, transparent 4px),radial-gradient(circle at 60% 60%,var(--cream) 0 3px, transparent 4px)}
.bluroverlay{position:absolute;inset:0;backdrop-filter:blur(1.5px);background:rgba(120,120,110,.25)}

.upload-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
input[type=file]{font-size:13px}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;font-size:12px;color:var(--ink);opacity:.5}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

label.field{display:block;margin-top:16px;font-size:14px;font-weight:600}
select, input[type=range]{width:100%;margin-top:6px}
select{padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font-family:inherit;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;background:var(--cream);user-select:none}
.chip input{display:none}
.chip.checked{background:var(--green);color:#fff;border-color:var(--green)}

.analyze-btn{margin-top:22px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--green-deep);color:#fff;font-family:'Fraunces','Noto Sans Devanagari',serif;font-size:17px;font-weight:600;cursor:pointer}
.analyze-btn:active{transform:translateY(1px)}
.analyze-btn:disabled{opacity:.5;cursor:not-allowed}

#result{display:none}
.verdict-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.verdict-name{font-size:22px}
.badge{font-size:12px;padding:5px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.badge.ok{background:rgba(59,107,62,.15);color:var(--green-deep)}
.badge.warn{background:rgba(181,83,60,.15);color:var(--rust)}
.confbar{height:8px;border-radius:99px;background:var(--line);margin:14px 0 4px;overflow:hidden}
.confbar > div{height:100%;background:var(--green)}
.confbar.warn > div{background:var(--rust)}
.conflabel{font-size:12px;opacity:.7}
.explain{margin-top:14px;font-size:15px;line-height:1.6}
.actions{margin-top:14px}
.actions p.label{font-size:13px;font-weight:600;margin-bottom:6px;opacity:.75}
.actions ul{margin:0;padding-left:20px}
.actions li{margin-bottom:5px;font-size:14.5px}

.expert-card{margin-top:18px;padding:16px;border-radius:12px;border:1px solid rgba(181,83,60,.3);background:rgba(181,83,60,.07)}
.expert-card p.who{font-weight:600;margin-bottom:2px}
.expert-card p.role{font-size:13px;opacity:.75;margin-bottom:10px}
.expert-card a.call{display:inline-block;margin-top:4px;background:var(--rust);color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600}

.disclaimer{font-size:13px;opacity:.65;margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
footer{padding:30px 0 calc(30px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;opacity:.55}
</style>
</head>
<body>

<header class="top">
  <svg class="logo" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="#FDF8F0" stroke="#6B4226" stroke-width="7"/><path d="M60 27 C90 30,104 54,96 82 C88 106,63 110,38 98 C28 76,36 46,60 27 Z" fill="#3F7D4A"/><path d="M60 32 C64 54,60 82,42 96" fill="none" stroke="#25462A" stroke-width="3" stroke-linecap="round"/></svg>
  <span class="brand">Krushi Sakha</span>
  <span class="langsel">
    <select id="langSelect" aria-label="Language">
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
      <option value="mr">मराठी</option>
    </select>
  </span>
</header>

<div class="wrap">
  <section class="hero">
    <h1 id="heroTitle"></h1>
    <p class="lead" id="heroLead"></p>
    <span class="note" id="heroNote"></span>
  </section>

  <section>
    <div class="panel">
      <h2 id="stepCropTitle"></h2>
      <p class="sub" id="stepCropSub"></p>
      <div class="crops" id="crops"></div>
    </div>

    <div class="panel">
      <h2 id="step1Title"></h2>
      <p class="sub" id="step1Sub"></p>
      <div class="samples" id="samples"></div>
      <div class="divider" id="orUpload"></div>
      <div class="upload-row">
        <input type="file" id="fileInput" accept="image/*">
        <span id="fileStatus" class="sub" style="margin:0"></span>
      </div>
    </div>

    <div class="panel">
      <h2 id="step2Title"></h2>
      <p class="sub" id="step2Sub"></p>

      <label class="field" for="rainfall" id="rainfallLabel"></label>
      <select id="rainfall">
        <option value="none" id="rNone"></option>
        <option value="light" id="rLight"></option>
        <option value="normal" selected id="rNormal"></option>
        <option value="heavy" id="rHeavy"></option>
      </select>

      <label class="field" for="humidity"><span id="humidityLabel"></span>: <span id="humidityVal">55</span>%</label>
      <input type="range" id="humidity" min="10" max="95" value="55">

      <label class="field" id="symptomsLabel"></label>
      <div class="chips" id="symptoms">
        <label class="chip"><input type="checkbox" value="yellow"><span data-chip="yellow"></span></label>
        <label class="chip"><input type="checkbox" value="spot"><span data-chip="spot"></span></label>
        <label class="chip"><input type="checkbox" value="wilt"><span data-chip="wilt"></span></label>
        <label class="chip"><input type="checkbox" value="holes"><span data-chip="holes"></span></label>
        <label class="chip"><input type="checkbox" value="stunt"><span data-chip="stunt"></span></label>
      </div>

      <button class="analyze-btn" id="analyzeBtn" disabled></button>
    </div>

    <div class="panel" id="result">
      <div class="verdict-head">
        <h2 class="verdict-name" id="vName"></h2>
        <span class="badge" id="vBadge"></span>
      </div>
      <div class="confbar" id="confbar"><div id="confbarfill"></div></div>
      <p class="conflabel" id="confLabel"></p>
      <p class="explain" id="vExplain"></p>
      <div class="actions">
        <p class="label" id="actionsLabel"></p>
        <ul id="vActions"></ul>
      </div>
      <div class="expert-card" id="expertCard" style="display:none">
        <p class="who" id="expertWho"></p>
        <p class="role" id="expertRole"></p>
        <p style="font-size:14px" id="expertNote"></p>
        <a class="call" id="callBtn" href="tel:+919876543210"></a>
      </div>
      <p class="disclaimer" id="disclaimer"></p>
    </div>
  </section>
</div>

<footer id="footer"></footer>

<script>

let currentLang = 'en';
let currentVisual = null, currentSampleId = null, currentCrop = 'tomato';

function buildCrops(){
  const el = document.getElementById('crops'); el.innerHTML='';
  CROP_ORDER.forEach(id=>{
    const btn = document.createElement('button');
    btn.className='cropchip'+(currentCrop===id?' active':''); btn.type='button';
    btn.innerHTML = `<span class="emoji">${CROP_EMOJI[id]}</span>${I18N[currentLang].crops[id]}`;
    btn.addEventListener('click', ()=>{
      currentCrop = id;
      document.querySelectorAll('.cropchip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
    el.appendChild(btn);
  });
}

function buildSamples(){
  const el = document.getElementById('samples'); el.innerHTML='';
  SAMPLE_ORDER.forEach(id=>{
    const btn = document.createElement('button');
    btn.className='sample'+(currentSampleId===id?' active':''); btn.type='button';
    btn.innerHTML = `<div class="leaf-icon">${SAMPLE_ICON[id]}</div>${I18N[currentLang].samples[id]}`;
    btn.addEventListener('click', ()=>{
      currentSampleId = id; currentVisual = SAMPLE_VISUAL[id];
      document.querySelectorAll('.sample').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('fileStatus').textContent='';
      document.getElementById('analyzeBtn').disabled=false;
    });
    el.appendChild(btn);
  });
}

function applyLang(){
  const t = I18N[currentLang];
  document.documentElement.lang = currentLang;
  document.getElementById('heroTitle').textContent=t.heroTitle;
  document.getElementById('heroLead').textContent=t.heroLead;
  document.getElementById('heroNote').textContent=t.heroNote;
  document.getElementById('stepCropTitle').textContent=t.stepCropTitle;
  document.getElementById('stepCropSub').textContent=t.stepCropSub;
  buildCrops();
  document.getElementById('step1Title').textContent=t.step1Title;
  document.getElementById('step1Sub').textContent=t.step1Sub;
  document.getElementById('orUpload').textContent=t.orUpload;
  document.getElementById('step2Title').textContent=t.step2Title;
  document.getElementById('step2Sub').textContent=t.step2Sub;
  document.getElementById('rainfallLabel').textContent=t.rainfallLabel;
  document.getElementById('rNone').textContent=t.rain.none;
  document.getElementById('rLight').textContent=t.rain.light;
  document.getElementById('rNormal').textContent=t.rain.normal;
  document.getElementById('rHeavy').textContent=t.rain.heavy;
  document.getElementById('humidityLabel').textContent=t.humidityLabel;
  document.getElementById('symptomsLabel').textContent=t.symptomsLabel;
  document.querySelectorAll('[data-chip]').forEach(s=> s.textContent = t.chips[s.dataset.chip]);
  document.getElementById('analyzeBtn').textContent=t.analyze;
  document.getElementById('footer').textContent=t.footer;
  document.getElementById('expertWho').textContent=t.expertWho;
  document.getElementById('expertRole').textContent=t.expertRole;
  document.getElementById('expertNote').textContent=t.expertNote;
  document.getElementById('callBtn').textContent=t.callBtn;
  document.getElementById('disclaimer').textContent=t.disclaimer;
  buildSamples();
  if(document.getElementById('result').style.display==='block') renderResult();
}

document.getElementById('langSelect').addEventListener('change', e=>{
  currentLang = e.target.value; applyLang();
});

document.getElementById('fileInput').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  currentSampleId = null;
  document.querySelectorAll('.sample').forEach(b=>b.classList.remove('active'));
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas'); c.width=40; c.height=40;
    const ctx = c.getContext('2d'); ctx.drawImage(img,0,0,40,40);
    const data = ctx.getImageData(0,0,40,40).data;
    let r=0,g=0,b=0,n=data.length/4, lastLum=0, edgeSum=0;
    for(let i=0;i<data.length;i+=4){r+=data[i];g+=data[i+1];b+=data[i+2];}
    r/=n; g/=n; b/=n;
    for(let i=0;i<data.length;i+=4){
      const lum=(data[i]+data[i+1]+data[i+2])/3;
      edgeSum += Math.abs(lum-lastLum); lastLum=lum;
    }
    const yellow = clamp(((r+g)/2 - b) / 255 * 1.4);
    const dark = clamp(1 - (r+g+b)/(3*180));
    const quality = clamp(edgeSum / (n*40));
    currentVisual = {yellow, spot: clamp(dark*0.6), wilt: clamp(yellow*0.4), holes: 0.05, quality: clamp(0.3+quality*3)};
  };
  img.src = URL.createObjectURL(file);
  document.getElementById('fileStatus').textContent = 'Using: '+file.name;
  document.getElementById('analyzeBtn').disabled=false;
});

document.getElementById('humidity').addEventListener('input', e=>{
  document.getElementById('humidityVal').textContent = e.target.value;
});
document.querySelectorAll('.chip input').forEach(cb=>{
  cb.addEventListener('change', ()=> cb.closest('.chip').classList.toggle('checked', cb.checked));
});
function clamp(x){return Math.max(0,Math.min(1,x));}

function analyze(v, ctx){
  const humid = ctx.humidity/100;
  const bump = k => ctx.symptoms.has(k) ? 0.15 : 0;
  let s = {
    healthy: clamp(1 - Math.max(v.yellow,v.spot,v.wilt,v.holes) - (1-v.quality)*0.3),
    blight: clamp(v.spot*0.65 + humid*0.3 + bump('spot')),
    nutrient: clamp(v.yellow*0.6 - v.spot*0.4 + (ctx.rainfall==='normal'||ctx.rainfall==='heavy'?0.2:0) + bump('yellow')),
    water: clamp(v.yellow*0.35 + v.wilt*0.4 + (ctx.rainfall==='none'?0.35:ctx.rainfall==='light'?0.15:0) + bump('wilt')),
    pest: clamp(v.holes*0.75 + bump('holes'))
  };
  const entries = Object.entries(s).sort((a,b)=>b[1]-a[1]);
  const [topKey, topScore] = entries[0];
  const margin = topScore - entries[1][1];
  const confidence = clamp(topScore * (0.5+0.5*v.quality) * (0.6+0.4*Math.min(margin/0.25,1)));
  const needsExpert = confidence < 0.55 || v.quality < 0.4 || margin < 0.1;
  return {topKey, confidence, needsExpert};
}

let lastCtx = null, lastVisual = null;
function renderResult(){
  const t = I18N[currentLang];
  const r = analyze(lastVisual, lastCtx);
  const meta = t.causes[r.topKey];
  const rl = t.rainCtx[lastCtx.rainfall];
  document.getElementById('vName').textContent = meta.name;
  document.getElementById('vExplain').textContent = typeof meta.explain==='function' ? meta.explain(lastCtx, rl) : meta.explain;
  document.getElementById('vActions').innerHTML = meta.actions.map(a=>`<li>${a}</li>`).join('');
  const pct = Math.round(r.confidence*100);
  document.getElementById('confbarfill').style.width = pct+'%';
  document.getElementById('confLabel').textContent = t.confidence+': '+pct+'%';
  const badge = document.getElementById('vBadge');
  const bar = document.getElementById('confbar');
  const expert = document.getElementById('expertCard');
  if(r.needsExpert){
    badge.textContent=t.badgeWarn; badge.className='badge warn';
    bar.className='confbar warn'; expert.style.display='block';
    document.getElementById('actionsLabel').textContent=t.actionsWarn;
  } else {
    badge.textContent=t.badgeOk; badge.className='badge ok';
    bar.className='confbar'; expert.style.display='none';
    document.getElementById('actionsLabel').textContent=t.actionsDefault;
  }
}

document.getElementById('analyzeBtn').addEventListener('click', ()=>{
  if(!currentVisual) return;
  lastVisual = currentVisual;
  lastCtx = {
    rainfall: document.getElementById('rainfall').value,
    humidity: +document.getElementById('humidity').value,
    symptoms: new Set([...document.querySelectorAll('.chip input:checked')].map(c=>c.value))
  };
  renderResult();
  document.getElementById('result').style.display='block';
  document.getElementById('result').scrollIntoView({behavior:'smooth', block:'start'});
});

applyLang();
</script>
